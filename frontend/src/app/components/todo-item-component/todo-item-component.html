<li class="list-group-item d-flex justify-content-between align-items-center">
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      style="margin-left:1%;"
      [checked]="task.status"
      (change)="onToggle()">
    <label class="form-check-label" [class.text-decoration-line-through]="task.status">
      {{ task.title }}
    </label>
  </div>
  <button class="btn btn-sm btn-outline-danger" (click)="onDelete()">
    Delete
  </button>
</li>
